name: Build SquadHub Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Publish self-contained desktop app
        run: dotnet publish src/SquadHub/SquadHub.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/SquadHub.iss'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SquadHub-Setup-Windows
          path: dist/SquadHub_Setup.exe
          if-no-files-found: error
